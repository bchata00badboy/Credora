<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Resumen - Credora</title>
    <link rel="stylesheet" href="grafica.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="dark">
    <div class="dashboard-row">

        <div class="summary-card">
            <div class="card-top">
                <span class="card-title">Balance Total</span>
                <button class="icon-btn" onclick="cambiarColorGrafica()">
                    <i class="fa-solid fa-palette"></i>
                </button>
            </div>
            <div class="card-balance">
                <h2 id="totalDisplay">$0.00</h2>
                <span class="badge positive"><i class="fa-solid fa-arrow-up"></i> 2.4%</span>
            </div>
            <div class="card-chart">
                <canvas id="credoraChart"></canvas>
            </div>
            <div class="card-filters">
                <button class="pill-btn active" onclick="cambiarPeriodo('dia', this)">Día</button>
                <button class="pill-btn" onclick="cambiarPeriodo('mes', this)">Mes</button>
                <button class="pill-btn" onclick="cambiarPeriodo('anio', this)">Año</button>
            </div>
        </div>

        <div class="summary-card usage-card">
            <div class="card-top">
                <span class="card-title">Distribución de Uso</span>
                <button class="icon-btn">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>
            </div>

            <div class="donut-container">
                <canvas id="usageChart"></canvas>
                <div class="donut-center-text">
                    <span class="small-label">Mayor Gasto</span>
                    <span class="big-percent">45%</span>
                </div>
            </div>

            <div class="custom-legend">
                <div class="legend-item">
                    <span class="dot color-1"></span>
                    <span class="l-text">Servicios</span>
                </div>
                <div class="legend-item">
                    <span class="dot color-2"></span>
                    <span class="l-text">Comida</span>
                </div>
                <div class="legend-item">
                    <span class="dot color-3"></span>
                    <span class="l-text">Ocio</span>
                </div>
            </div>
        </div>

    </div>
    <script src="grafica.js"></script>
</body>
</html>
