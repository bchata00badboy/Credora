<!-- Front-end\Src\Pages\Main\Dashboard.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credora - Dashboard</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/Main.css">
    <link rel="stylesheet" href="css/grafica.css">
    <link rel="stylesheet" href="css/ia.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="css/kyc.css">
    <link rel="stylesheet" href="css/loader.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" referrerpolicy="no-referrer" />

</head>
<body class="app-root">

    <div id="preloader">
        <div class="loader-spinner"></div>
        <div class="loader-text">CREDORA</div>
    </div>

    <button id="chatbot-toggler" class="chatbot-toggler" aria-label="Abrir chat">
        <i class="fa-solid fa-comment"></i>
    </button>

    <div class="chatbot-interface">
        
        <header class="ai-header">
            <div class="header-info">
                <div class="ai-avatar">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="ai-text">
                    <h3>Nelly</h3>
                    <p><span class="dot-online"></span>Asistente Virtual</p>
                </div>
            </div>
            
            <button id="close-btn" class="close-btn" aria-label="Cerrar chat">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </header>

        <ul class="chat-box" id="chatBox">
            <li class="chat incoming">
            <div class="msg-content">
                    <p>Hola 👋 soy Nelly, tu asistente financiero.<br>Haz click en una opción para empezar.</p>
                </div>
            </li>
        </ul>

        <div class="suggestions-bar">
            <!-- escritura deshabilitada por diseño: no añadir opción de escribir -->
        </div>

        <!-- Entrada de texto eliminada: interacción solo por selección -->
    </div>

    <div id="canvas-container"></div>

    <div class="sidebar minimize" id="sidebar">
        <div class="logo_content">
            <img src="../../Assets/Icons/Favicon.png" alt="Logo">
            <div class="logo_name">Credora</div>
        </div>

        <div class="input-box">
            <i class='bx bx-search'></i>
            <input type="text" placeholder="Buscar..." id="searchInput">
        </div>

        <ul class="nav_list">
            <li style="--i:1">
                <a href="#" class="active nav-link menu-link" data-vista="Main_Parts/main_home.html">
                    <i class='bx bx-home-smile'></i>
                    <span class="links_name">Inicio</span>
                </a>
            </li>
            <li style="--i:2">
                <a href="#" class="nav-link menu-link" data-vista="Main_Parts/main_mov.html">
                    <i class='bx bx-list-check'></i>
                    <span class="links_name">Movimientos</span>
                </a>
            </li>
            <li style="--i:3" id="transfer-item">
                <a href="#" class="dropdown-trigger nav-link">
                    <i class='bx bx-send'></i>
                    <span class="links_name">Transferencia</span>
                    <i class='bx bx-chevron-down arrow'></i>
                </a>
                <div class="submenu-wrapper">
                    <a href="#" class="nav-link sub-menu-link" data-vista="Main_Parts/main_transf1.html">
                        <i class='bx bx-user'></i><span class="links_name">Transferir</span>
                    </a>
                    <a href="#" class="nav-link sub-menu-link" data-vista="Main_Parts/main_mov_data.html">
                        <i class='bx bx-file-find'></i><span class="links_name">Ver mis datos</span>
                    </a>
                </div>
            </li>
            <li style="--i:4">
                <a href="#" class="nav-link menu-link" data-vista="Main_Parts/main_educ.html">
                    <i class='bx bx-book-reader'></i>
                    <span class="links_name">Educación</span>
                </a>
            </li>
            <li style="--i:5">
                <a href="#" class="nav-link menu-link" data-vista="Main_Parts/main_config.html">
                    <i class='bx bx-cog'></i>
                    <span class="links_name">Configuración</span>
                </a>
            </li>
            <li style="--i:6">
                <a href="#" class="nav-link" id="btn-logout-sidebar">
                    <i class='bx bx-exit'></i>
                    <span class="links_name">Cerrar Sesión</span>
                </a>
            </li>
            <li class="divider" style="--i:7"></li>
            <div class="footer_div">
                <li style="--i:9"><a href="#" class="nav-link menu-link" data-vista="Main_Parts/main_profile.html"><i class='bx bx-id-card'></i><span class="links_name">Perfil</span></a></li>
            </div>
        </ul>
    </div>

    <!-- Overlay que aparece al abrir la sidebar -->
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <!-- Botón de notificaciones en la esquina superior derecha -->
    <div class="top-actions">
        <button id="notif-button" class="notif-btn" aria-label="Notificaciones" title="Notificaciones" onclick="window.cargarVista && window.cargarVista('Main_Parts/main_notif.html')">
            <i class="fa-solid fa-bell"></i>
            <span class="notif-badge">0</span>
        </button>
    </div>

    <main class="home_content" id="contenedor-dinamico"></main>

    <script src="js/theme.js"></script>
    <script src="js/api.js"></script> 
    <script src="js/Main.js"></script>
    <script src="js/ia.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/grafica.js"></script>

</body>
</html>
