<style>
    /* --- GESTIÓN DE TEMAS (CLARO / OSCURO) --- */
    :root {
        /* Colores Fijos (No cambian) */
        --accent-blue: #3498db;
        
        /* Colores MODO CLARO (Por defecto) */
        --bg-card: #ffffff;
        --text-title: #002845;      /* Azul oscuro original */
        --text-subtitle: #000000;   /* Negro original */
        --text-desc: #151a24;       /* Texto descripción */
        --line-color: #000000;      /* Línea negra */
        --bg-icon-box: #f8f9fa;     /* Fondo gris claro del icono */
        --icon-color-def: #4b5563;  /* Icono gris oscuro */
        --shadow-color: rgba(0,0,0,0.05);
        --btn-bg: #ffffff;
    }

    /* SOBREESCRIBIMOS PARA MODO OSCURO */
    /* (Asumiendo que tu sistema agrega la clase 'dark' al body) */
    body.dark {
        --bg-card: #1f2937;         /* Gris oscuro para tarjetas */
        --text-title: #f3f4f6;      /* Blanco suave para títulos */
        --text-subtitle: #d1d5db;   /* Gris claro para subtítulos */
        --text-desc: #9ca3af;       /* Gris medio para descripciones */
        --line-color: #4b5563;      /* Línea gris visible pero no brillante */
        --bg-icon-box: #111827;     /* Fondo casi negro para el icono */
        --icon-color-def: #9ca3af;  /* Icono gris claro */
        --shadow-color: rgba(0,0,0,0.3); /* Sombras más fuertes en oscuro */
        --btn-bg: #374151;          /* Fondo del botón atrás */
    }

    /* --- ESTILOS GENERALES --- */
    
    /* ANIMACIÓN DE ENTRADA */
    @keyframes entryFade {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .edu-container {
        width: 100%;
        padding: 10px 20px;
        font-family: 'Segoe UI', sans-serif;
        animation: entryFade 0.6s ease-out forwards;
        
        /* Transición suave al cambiar de tema */
        transition: background-color 0.3s, color 0.3s; 
    }

    /* --- HEADER --- */
    .header-section {
        width: 100%;
        /* CAMBIO: Usamos variable para la línea */
        border-bottom: 1px solid var(--line-color); 
        padding-bottom: 25px;
        margin-bottom: 25px;
        transition: border-color 0.3s;
    }

    .header-row {
        display: flex;
        align-items: center; 
        gap: 20px;
        margin-left: -10px; 
    }

    /* Botón de atrás */
    .back-btn-circle {
        width: 45px;
        height: 45px;
        /* CAMBIO: Fondo dinámico */
        background-color: var(--btn-bg); 
        border-radius: 50%;
        border: none;
        box-shadow: 0 3px 6px var(--shadow-color);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.3s, color 0.3s;
        /* CAMBIO: Color dinámico */
        color: var(--text-title); 
        font-size: 1.2rem;
        flex-shrink: 0;
    }

    .back-btn-circle:hover {
        transform: scale(1.1);
    }

    .header-texts {
        display: flex;
        flex-direction: column;
    }

    .page-title {
        font-size: 1.8rem;
        font-weight: 800;
        /* CAMBIO: Color dinámico */
        color: var(--text-title); 
        margin: 0;
        line-height: 1;
        transition: color 0.3s;
    }

    .page-subtitle {
        font-size: 1.0rem;
        /* CAMBIO: Color dinámico */
        color: var(--text-subtitle); 
        margin: 5px 0 0 0;
        font-weight: 400;
        transition: color 0.3s;
    }

    /* --- GRID --- */
    .edu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 25px;
    }

    .edu-card {
        /* CAMBIO: Fondo dinámico */
        background: var(--bg-card); 
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 10px var(--shadow-color);
        transition: all 0.3s ease;
        border: 1px solid var(--shadow-color); /* Borde sutil */
        display: flex;
        flex-direction: column;
        cursor: pointer;
        position: relative;
    }

    /* ANIMACIÓN TARJETA HOVER */
    .edu-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 30px rgba(52, 152, 219, 0.15); /* Esta sombra azul la dejamos igual */
        border-color: var(--accent-blue);
    }

    .edu-card-img {
        height: 150px;
        /* CAMBIO: Fondo dinámico */
        background: var(--bg-icon-box); 
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.3s;
    }

    /* Estado inicial del icono */
    .edu-card-img i {
        font-size: 4rem;
        /* CAMBIO: Color dinámico (gris oscuro en light, gris claro en dark) */
        color: var(--icon-color-def); 
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.3s ease;
    }

    /* Estado Hover: AZUL y CRECE */
    .edu-card:hover .edu-card-img i {
        transform: scale(1.2);
        color: var(--accent-blue); /* Se vuelve azul siempre */
    }

    .edu-card-body {
        padding: 25px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
    }

    .edu-card-title {
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 8px;
        /* CAMBIO: Color dinámico */
        color: var(--text-title); 
        transition: color 0.3s;
    }

    .edu-card-desc {
        font-size: 0.9rem;
        /* CAMBIO: Color dinámico */
        color: var(--text-desc); 
        line-height: 1.5;
        margin-bottom: 20px;
        font-weight: 400;
        transition: color 0.3s;
    }

    .edu-card-link {
        margin-top: auto;
        text-align: right;
        font-size: 1rem;
        font-weight: 700;
        color: var(--accent-blue); /* El enlace siempre azul */
        text-decoration: underline;
    }
</style>

<div class="edu-container">
    
    <div class="header-section">
        <div class="header-row">
            <div class="header-texts">
                <h1 class="page-title">Educación Financiera</h1>
                <p class="page-subtitle">Aprende estrategias para mejorar tu economía personal</p>
            </div>
        </div>
    </div>

    <div id="financial-modules-grid" class="edu-grid"></div>

</div>

<script>
    window.cargarLeccion = function(ruta) {
        const contenedor = document.getElementById('contenedor-dinamico');
        
        contenedor.scrollTop = 0; 
        window.scrollTo(0, 0);

        contenedor.style.opacity = '0.5';

        fetch(ruta)
            .then(response => {
                if (!response.ok) throw new Error('No se encontró el archivo de la lección');
                return response.text();
            })
            .then(html => {
                contenedor.innerHTML = html;
                contenedor.style.opacity = '1';
                contenedor.scrollTop = 0;
            })
            .catch(error => {
                console.error('Error:', error);
                contenedor.innerHTML = '<h2 style="text-align:center; padding:50px;">🚧 Esta lección está en construcción 🚧</h2>';
                contenedor.style.opacity = '1';
            });
    };

    (function() {
        const modules = [
            { 
                title: "Domina Tu Presupuesto", 
                desc: "Aprende a categorizar gastos y establecer límites.", 
                icon: "fa-chart-pie",
                view: "Main_Parts/temasDeClases/presupuesto.html" 
            },
            { 
                title: "Metas de Ahorro", 
                desc: "Técnicas para ahorrar sin sacrificar tu estilo de vida.", 
                icon: "fa-piggy-bank",
                view: "Main_Parts/temasDeClases/ahorro.html"
            },
            { 
                title: "Libérate de Deudas", 
                desc: "Métodos bola de nieve y avalancha para eliminar pasivos.", 
                icon: "fa-link-slash",
                view: "Main_Parts/temasDeClases/deudas.html"
            },
            { 
                title: "Principios de Inversión", 
                desc: "Conceptos básicos para hacer crecer tu capital.", 
                icon: "fa-arrow-trend-up",
                view: "Main_Parts/temasDeClases/inversion.html"
            },
            { 
                title: "Seguridad Digital", 
                desc: "Cómo proteger tus cuentas bancarias y evitar estafas.", 
                icon: "fa-shield-halved",
                view: "Main_Parts/temasDeClases/seguridad.html"
            },
            { 
                title: "Impuestos Básicos", 
                desc: "Guía rápida para entender tus obligaciones fiscales.", 
                icon: "fa-file-invoice",
                view: "Main_Parts/temasDeClases/impuestos.html"
            }
        ];

        const grid = document.getElementById('financial-modules-grid');
        
        if(grid) {
            grid.innerHTML = ''; 
            modules.forEach(mod => {
                const card = document.createElement('div');
                card.className = 'edu-card';
                card.setAttribute('onclick', `cargarLeccion('${mod.view}')`);
                card.innerHTML = `
                    <div class="edu-card-img"><i class="fa-solid ${mod.icon}"></i></div>
                    <div class="edu-card-body">
                        <h3 class="edu-card-title">${mod.title}</h3>
                        <p class="edu-card-desc">${mod.desc}</p>
                        <a href="#" class="edu-card-link" onclick="event.preventDefault(); cargarLeccion('${mod.view}')">Comenzar lección &rarr;</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    })();
</script>
