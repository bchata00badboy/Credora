<!-- /Front-end/Src/Pages/Main/Main_Parts/main_profile.html -->
<section class="content-section" id="vista-perfil">
    <header> 
        <h1>Mi Perfil</h1>
        <p>Gestiona tu información personal y seguridad</p>
    </header>

    <div class="perfil-grid">
        <div class="card-perfil profile-single" id="profile-single">
            <div style="display:flex; gap:18px; align-items:center; justify-content:space-between;">
                <div style="display:flex; gap:18px; align-items:center;">
                    <div class="avatar-circle" id="profile-avatar"></div>
                    <div>
                        <h2 id="profile-name">Cargando usuario...</h2>
                        <p class="rol">Cliente Credora</p>
                    </div>
                </div>
                <div style="position:relative;">
                    <div class="actions-popover" id="profile-actions-popover">
                        </div>
                </div>
            </div>

            <hr style="border:none; height:1px; background:rgba(0,0,0,0.06); margin:18px 0;" />

            <div class="info-list">
                <div class="info-row"><span class="label">Correo:</span><span class="value" id="profile-email">...</span></div>
                <div class="info-row"><span class="label">Nro. Cuenta:</span><span class="value monospace" id="profile-account">...</span></div>
                <div class="info-row"><span class="label">Cédula:</span><span class="value" id="profile-cedula">...</span></div>
                <div class="info-row"><span class="label">Dirección:</span><span class="value" id="profile-direccion">...</span></div>
                <div class="info-row"><span class="label">Teléfono:</span><span class="value" id="profile-telefono">...</span></div>
                <div class="info-row"><span class="label">Estado:</span><span class="value status-active" id="profile-status">...</span></div>
            </div>
            
            <div class="seguridad">
                <h3>Seguridad</h3>
                <div class="seguridad-actions">
                    <button class="btn btn-blue register" id="btn-kyc">Verificarse KYC</button>
                    <button class="btn btn-blue change-pass" data-modal="modal-pass">Cambiar contraseña</button>
                    <button class="btn btn-blue change-pin" data-modal="modal-pin">Cambiar PIN</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-pass" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3>Cambiar contraseña</h3>
                <button class="modal-close" aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-body">
                <form id="form-change-pass">
                    <div class="form-group">
                        <label>Contraseña actual</label>
                        <input type="password" name="old-pass" placeholder="Contraseña actual" required>
                    </div>
                    <div class="form-group">
                        <label>Nueva contraseña</label>
                        <input type="password" name="new-pass" placeholder="Nueva contraseña" required>
                    </div>
                    <div class="form-group">
                        <label>Confirmar nueva contraseña</label>
                        <input type="password" name="confirm-pass" placeholder="Confirmar" required>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-blue">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-pin" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true">
            <div class="modal-header">
                <h3>Cambiar PIN</h3>
                <button class="modal-close" aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-body">
                <form id="form-change-pin">
                    <div class="form-group">
                        <label>PIN actual</label>
                        <div class="pin-input" data-group="old">
                            <input inputmode="numeric" pattern="\d*" maxlength="1" class="pin-digit">
                            <input inputmode="numeric" pattern="\d*" maxlength="1" class="pin-digit">
                            <input inputmode="numeric" pattern="\d*" maxlength="1" class="pin-digit">
                            <input inputmode="numeric" pattern="\d*" maxlength="1" class="pin-digit">
                            <input type="hidden" name="old-pin">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Nuevo PIN (4 dígitos)</label>
                        <div class="pin-input" data-group="new">
                            <input inputmode="numeric" pattern="\d*" maxlength="1" class="pin-digit">
                            <input inputmode="numeric" pattern="\d*" maxlength="1" class="pin-digit">
                            <input inputmode="numeric" pattern="\d*" maxlength="1" class="pin-digit">
                            <input inputmode="numeric" pattern="\d*" maxlength="1" class="pin-digit">
                            <input type="hidden" name="new-pin">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirmar PIN</label>
                        <div class="pin-input" data-group="confirm">
                            <input inputmode="numeric" pattern="\d*" maxlength="1" class="pin-digit">
                            <input inputmode="numeric" pattern="\d*" maxlength="1" class="pin-digit">
                            <input inputmode="numeric" pattern="\d*" maxlength="1" class="pin-digit">
                            <input inputmode="numeric" pattern="\d*" maxlength="1" class="pin-digit">
                            <input type="hidden" name="confirm-pin">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-blue">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
