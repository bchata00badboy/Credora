<!-- /Front-end/Src/Pages/Main/Main_Parts/main_profile.html -->

<link rel="stylesheet" href="css/profile.css">

<section class="content-section" id="vista-perfil">
    <header> 
        <h1>Mi Perfil</h1>
        <p>Gestiona tu información personal y seguridad</p>
    </header>

    <div class="perfil-grid">
        
        <div class="card-perfil datos-usuario">
            <div class="avatar-circle" id="profile-avatar">
                </div>
            
            <h2 id="profile-name">Cargando usuario...</h2>
            <p class="rol">Cliente Credora</p>
            
            <div class="info-container">
                <div class="info-row">
                    <span class="label">Correo:</span>
                    <span class="value" id="profile-email">...</span>
                </div>
                
                <div class="info-row">
                    <span class="label">Nro. Cuenta:</span>
                    <span class="value monospace" id="profile-account">...</span>
                </div>
                
                <div class="info-row">
                    <span class="label">Estado:</span>
                    <span class="value status-active">Activo</span>
                </div>
            </div>

            <div class="profile-actions">
                <button class="btn-action menu-link" data-vista="Main_Parts/main_kyc.html">
                    <i class='bx bx-id-card'></i> Verificar Identidad (KYC)
                </button>
            </div>
        </div>

        <div class="card-perfil seguridad">
            <h3>Cambiar Contraseña</h3>
            <form id="form-password">
                <div class="form-group">
                    <label for="pass-actual">Contraseña Actual</label>
                    <input type="password" id="pass-actual" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="pass-nueva">Nueva Contraseña</label>
                    <input type="password" id="pass-nueva" placeholder="Ingresa nueva contraseña" required>
                </div>

                <div class="form-group">
                    <label for="pass-confirm">Confirmar Contraseña</label>
                    <input type="password" id="pass-confirm" placeholder="Repite nueva contraseña" required>
                </div>

                <button type="submit" class="btn-guardar">Actualizar Contraseña</button>
            </form>
        </div>

    </div>
</section>
