<section class="content-section vista-transferencias">
    <header>
        <h1>Realizar Transferencia</h1>
        <p>Envía dinero a otras cuentas</p>
    </header>

    <div class="transfer-grid">
        
        <div class="card card-form">
            <h3>Detalles de la operación</h3>
            
            <form class="form-transferencia">
                
                <div class="form-group">
                    <label>Cuenta de Origen</label>
                    <div class="account-select">
                        <div class="acc-icon">
                            <i class='bx bx-wallet'></i>
                        </div>
                        <div class="acc-info">
                            <span class="acc-name">Cuenta Principal</span>
                            <span class="acc-balance">Saldo disponible: <strong>$1,250.00</strong></span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nombre del Beneficiario</label>
                    <div class="input-with-icon">
                        <input type="text" placeholder="Ejemplo: Pedro Gonzales">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Cedula del Beneficiario</label>
                        <input type="text" placeholder="Ejemplo: 33.456.789" class="input-simple">
                    </div>
                    <div class="form-group">
                        <label>Telefono del Beneficiario</label>
                        <input type="text" placeholder="Ejemplo: 0412-1234567" class="input-simple">
                    </div>
                </div>

                <div class="form-group">
                    <label>Monto a transferir</label>
                    <div class="monto-input-container">
                        <span class="currency-symbol">$</span>
                        <input type="number" placeholder="0.00" class="input-monto">
                    </div>
                </div>

                <div class="form-group">
                    <label>Concepto / Referencia</label>
                    <input type="text" placeholder="Ej: Pago de renta" class="input-simple">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancelar">Cancelar</button>
                    <button type="button" class="btn-confirmar">Continuar</button>
                </div>
            </form>
        </div>

        <div class="sidebar-transfer">
            <div class="limites-card">
                <i class='bx bx-info-circle'></i>
                <div>
                    <h4>Límites diarios</h4>
                    <p>Puedes transferir hasta $2,000.00 hoy sin comisiones.</p>
                </div>
            </div>
        </div>

    </div>

</section>
