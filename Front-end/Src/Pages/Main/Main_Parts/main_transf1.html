<section class="content-section vista-transferencias">
    <header>
        <h1>Realizar Transferencia</h1>
        <p>Envía dinero a otras cuentas</p>
    </header>

    <div class="transfer-grid">
        
        <div class="card card-form">
            <h3>Detalles de la operación</h3>
            
            <form class="form-transferencia">
                <div class="form-group">
                    <label>Cuenta de Origen</label>
                    <div class="account-select">
                        <div class="acc-icon"><i class='bx bx-wallet'></i></div>
                        <div class="acc-info">
                            <span class="acc-name">Cuenta Principal</span>
                            <span class="acc-balance">Saldo disponible: <strong>$1,250.00</strong></span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nombre del Beneficiario</label>
                    <div class="input-with-icon">
                        <input type="text" placeholder="Ejemplo: Pedro Gonzales">
                        <i class='bx bx-user'></i>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Cédula / Identificador</label>
                        <input type="text" placeholder="Correo o Cédula" class="input-simple">
                    </div>
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="text" placeholder="Ej: 0412-1234567" class="input-simple">
                    </div>
                </div>

                <div class="form-group">
                    <label>Monto a transferir</label>
                    <div class="monto-input-container">
                        <span class="currency-symbol">$</span>
                        <input type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" class="input-monto" oninput="this.value=this.value.replace(/[^0-9.]/g,''); if(this.value<0) this.value='';">
                    </div>
                </div>

                <div class="form-group">
                    <label>Concepto</label>
                    <input type="text" placeholder="Ej: Pago de servicios" class="input-simple">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancelar">Cancelar</button>
                    <button type="button" class="btn-confirmar">Continuar</button>
                </div>
            </form>
        </div>

        <div class="sidebar-transfer">
            <div class="limites-card">
                <i class='bx bx-info-circle'></i>
                <div>
                    <h4>Límites diarios</h4>
                    <p>Puedes transferir hasta $2,000.00 hoy sin comisiones.</p>
                </div>
            </div>
        </div>

    </div>

    <div id="pinModal" class="modal-overlay" aria-hidden="true" style="display: none;">
        <div class="modal-card pin-modal-box">
            <div class="modal-header">
                <h3><i class='bx bxs-lock-alt'></i> Seguridad</h3>
            </div>
            <div class="modal-body">
                <p style="text-align: center; margin-bottom: 20px;">Ingresa tu PIN de 4 dígitos.</p>
                
                <div class="pin-container">
                    <input type="password" class="pin-box" maxlength="1" id="pin1" placeholder="•">
                    <input type="password" class="pin-box" maxlength="1" placeholder="•">
                    <input type="password" class="pin-box" maxlength="1" placeholder="•">
                    <input type="password" class="pin-box" maxlength="1" placeholder="•">
                </div>
                
                <div class="modal-actions" style="margin-top: 20px;">
                    <button class="btn-cancelar" onclick="toggleModal(false)">Cancelar</button>
                    <button class="btn-confirmar" onclick="confirmarConPin()">Confirmar</button>
                </div>
            </div>
        </div>
    </div>

</section>
