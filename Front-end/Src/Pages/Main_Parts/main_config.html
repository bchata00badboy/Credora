<section class="content-section vista-configuracion">
    <header>
        <h1>Configuración</h1>
        <p>Personaliza tu experiencia en Credora</p>
    </header>

    <div class="config-grid">
        
        <div class="card">
            <h3>Preferencias</h3>
            
            <div class="config-item">
                <div class="config-info">
                    <h4>Notificaciones Push</h4>
                    <p>Recibir alertas en el escritorio</p>
                </div>
                <label class="switch">
                    <input type="checkbox" checked>
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="config-item">
                <div class="config-info">
                    <h4>Modo Oscuro</h4>
                    <p>Cambiar apariencia de la interfaz</p>
                </div>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="config-item">
                <div class="config-info">
                    <h4>Idioma</h4>
                </div>
                <select class="select-simple">
                    <option>Español</option>
                    <option>English</option>
                </select>
            </div>
        </div>

        <div class="card">
            <h3>Zona de Peligro</h3>
            <p style="margin-bottom: 1rem; font-size: 0.9rem; color: #666;">Acciones irreversibles sobre tu cuenta.</p>
            
            <button class="btn-outline-danger">Cerrar sesiones en otros dispositivos</button>
            <button class="btn-danger">Eliminar Cuenta</button>
        </div>

    </div>
</section>
