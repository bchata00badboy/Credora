<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credora Login</title>
    <link rel="shortcut icon" href="../../Assets/Icons/Favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <div class="background"></div>

    <a href="../Home/Home.html" class="back-home" style="position:fixed;top:20px;left:20px;background:rgba(255,255,255,0.95);color:#003049;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:600;z-index:1000;">← Volver al Home</a>

    <div class="bubbles" id="wallet-container"></div>

    <div class="container">
        
        <div class="content-box">
            <div class="brand-section">
                <img src="credora2.0.png" alt="Credora Logo" class="logo-welcome">
                <h1 class="brand-name"></h1>
            </div>

            <div class="text-sci">
                <h2>Bienvenido <br><span>A Nuestra Plataforma</span></h2>
                <p class="expanded-text">Conéctate con tu futuro financiero de manera segura y rápida.</p>
            </div>
        </div>

        <div class="logreg-box">
            <div class="form-box login">
                <form action="#">
                    <h2>Iniciar Sesión</h2>
                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-envelope'></i></span>
                        <input type="email" placeholder=" " required>
                        <label>Email</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-lock-alt'></i></span>
                        <input type="password" placeholder=" " required>
                        <label>Contraseña</label>
                    </div>
                    <div class="remember-forgot">
                        <label><input type="checkbox"> Recordarme</label>
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </div>
                    <button type="submit" class="btn">Ingresar</button>
                    <div class="login-register">
                        <p>¿No tienes cuenta? <a href="#" class="register-link">Regístrate</a></p>
                    </div>
                </form>
            </div>

            <div class="form-box register">
                <form action="#">
                    <h2>Regístrate</h2>
                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-user'></i></span>
                        <input type="text" placeholder=" " required>
                        <label>Nombre</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-envelope'></i></span>
                        <input type="email" placeholder=" " required>
                        <label>Email</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-lock-alt'></i></span>
                        <input type="password" placeholder=" " required>
                        <label>Contraseña</label>
                    </div>
                    <div class="remember-forgot">
                        <label><input type="checkbox"> Acepto términos y condiciones</label>
                    </div>
                    <button type="submit" class="btn">Registrar</button>
                    <div class="login-register">
                        <p>¿Ya tienes cuenta? <a href="#" class="login-link">Inicia Sesión</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
