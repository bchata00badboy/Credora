<!-- Front-end\Src\Pages\login\login.html -->

<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Meta tags para configuración de la página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credora - Acceso</title>
    
    <!-- Fuentes de Google (Poppins) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    
    <!-- Iconos Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- Estilos locales -->
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <!-- Contenedor de aurora boreal (fondo animado) -->
    <div class="aurora-container">
        <div class="aurora-blob aurora-red"></div>
        <div class="aurora-blob aurora-blue"></div>
    </div>

    <!-- Contenedor para las billeteras animadas (copos de nieve) -->
    <div class="snowflakes-container" id="snowflakes-container"></div>

    <!-- Contenedor principal del login/registro -->
    <div class="container">
        
        <!-- FORMULARIO DE LOGIN -->
        <div class="form_box login">
            <form action="#" id="formLogin">
                <h1>Iniciar Sesión</h1>
                
                <!-- Input de correo electrónico -->
                <div class="input_box">
                    <input type="email" id="loginEmail" placeholder="Correo electrónico" required>
                    <i class='bx bxs-envelope'></i>
                </div>

                <!-- Input de contraseña -->
                <div class="input_box">
                    <input type="password" id="loginPass" placeholder="Contraseña" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <!-- Link de contraseña olvidada -->
                <div class="forgot_link">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Botón de envío -->
                <button type="submit" class="btn">Iniciar Sesión</button>
            </form>
        </div>

        <!-- FORMULARIO DE REGISTRO -->
        <div class="form_box register">
            <form action="#" id="formRegister">
                <h1>Registrarse</h1>
                
                <!-- Input de nombre y apellido -->
                <div class="input_box">
                    <input type="text" id="regNombre" placeholder="Nombre y Apellido" required>
                    <i class='bx bxs-user'></i>
                </div>
                
                <!-- Input de correo electrónico -->
                <div class="input_box">
                    <input type="email" id="regEmail" placeholder="Correo electrónico" required>
                    <i class='bx bxs-envelope'></i>
                </div>

                <!-- Input de contraseña -->
                <div class="input_box">
                    <input type="password" id="regPass" placeholder="Contraseña" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <!-- Input de confirmación de contraseña -->
                <div class="input_box">
                    <input type="password" id="regConfirmPass" placeholder="Confirmar contraseña" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <!-- Botón de registro -->
                <button type="submit" class="btn">Registrarse</button>
            </form>
        </div>

        <!-- PANEL DESLIZANTE (con gradient rojo-azul y logos) -->
        <div class="toggle_box">
            <!-- Panel izquierdo (visible en login, se oculta en registro) -->
            <div class="toggle_panel toggle-left">
                <img src="../../Assets/Images/credora2.0.png" alt="Credora Logo">
                <h1>¡Hola, Bienvenido!</h1>
                <p>¿No tienes una cuenta aún?</p>
                <button class="btn register-btn">Registrarse</button>
            </div>
            
            <!-- Panel derecho (oculto en login, visible en registro) -->
            <div class="toggle_panel toggle-right">
                <img src="../../Assets/Images/credora2.0.png" alt="Credora Logo">
                <h1>¡Bienvenido de nuevo!</h1>
                <p>¿Ya tienes una cuenta?</p>
                <button class="btn login-btn">Iniciar Sesión</button>
            </div>
        </div>
    </div>

    <!-- Script local -->
    <script src="login.js"></script>
    <script src="conexion.js"></script>
</body>
</html>
